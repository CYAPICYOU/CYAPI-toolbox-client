[package]
name = "cyapi-toolbox"
version = "2.0.0"
description = "A local-first skill toolbox"
authors = ["CYAPI"]
edition = "2021"

[lib]
name = "cyapi_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tokio = { version = "1", features = ["net", "time", "io-util", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml_edit = "0.25"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
windows-sys = { version = "0.61", features = ["Win32_Networking_WinInet", "Win32_Foundation", "Win32_UI_Controls_Dialogs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
jsonc-parser = { version = "0.34.0", features = ["cst", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
zstd = "0.13"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 16
lto = true
opt-level = "s"
strip = true
